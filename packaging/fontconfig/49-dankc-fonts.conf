<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>
    dankc system-wide font fallback. Mirrors dankc's own fontconfig-located
    fallback chain (Inter UI font + a broad Noto script chain + DejaVu
    safety net + Noto Color Emoji, see src/render/nvg.c) so browsers and
    GTK/Qt apps get comprehensive, non-tofu coverage across essentially
    every script Noto ships, the same way dankc's own nanovg renderer does
    for the scripts it explicitly resolves. Installed to /etc/fonts/conf.d/
    by the dankc package; remove it (or mask with a higher-numbered conf.d
    file) if you run your own fontconfig setup — see packaging/README.md.

    fontconfig scores each candidate font primarily by family-list order,
    but a font later in the list still wins whenever an earlier one plain
    lacks the requested codepoint's charset — that's what lets one big
    per-script Noto family list here cover every script's fallback without
    a hand-written match rule per language. The explicit lang=ur/ar (never
    DejaVu, which lacks the Urdu-only letters), lang=zh/ja/ko (Noto Sans
    CJK is one OTC file with a family name per region) and emoji rules
    below are kept as strong belt-and-suspenders on top of that.
  </description>

  <!-- ================= Generic family fallback chains =================
       Ordered: Inter (dankc's own UI font, Latin/Cyrillic/Greek/etc. if
       installed system-wide) -> Noto Sans (same, but always installed via
       the noto-fonts dependency) -> one Noto Sans face per non-Latin
       script noto-fonts/noto-fonts-cjk ship -> DejaVu as the very last
       Latin/symbol safety net. -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>InterVariable</family>
      <family>Noto Sans</family>
      <!-- Middle East / South Asia -->
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Gurmukhi</family>
      <family>Noto Sans Gujarati</family>
      <family>Noto Sans Oriya</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Kannada</family>
      <family>Noto Sans Malayalam</family>
      <family>Noto Sans Sinhala</family>
      <!-- Southeast Asia -->
      <family>Noto Sans Thai</family>
      <family>Noto Sans Lao</family>
      <family>Noto Sans Khmer</family>
      <family>Noto Sans Myanmar</family>
      <!-- East Asia (Noto Sans CJK is one OTC; list every region face) -->
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <!-- Caucasus / Africa -->
      <family>Noto Sans Armenian</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Ethiopic</family>
      <!-- Americas -->
      <family>Noto Sans Cherokee</family>
      <family>Noto Sans Canadian Aboriginal</family>
      <!-- Symbols / math (currency, dingbats, technical, math operators) -->
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
      <family>Noto Sans Math</family>
      <!-- Last-resort Latin/symbol safety net -->
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <!-- Middle East / South Asia -->
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif Hebrew</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Serif Bengali</family>
      <family>Noto Serif Gurmukhi</family>
      <family>Noto Serif Gujarati</family>
      <family>Noto Serif Tamil</family>
      <family>Noto Serif Telugu</family>
      <family>Noto Serif Kannada</family>
      <family>Noto Serif Malayalam</family>
      <family>Noto Serif Sinhala</family>
      <!-- Southeast Asia -->
      <family>Noto Serif Thai</family>
      <family>Noto Serif Lao</family>
      <family>Noto Serif Khmer</family>
      <family>Noto Serif Myanmar</family>
      <!-- East Asia -->
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <!-- Caucasus / Africa -->
      <family>Noto Serif Armenian</family>
      <family>Noto Serif Georgian</family>
      <family>Noto Serif Ethiopic</family>
      <!-- Last-resort Latin safety net -->
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
      <!-- No dedicated monospace face exists for most non-Latin scripts;
           fall through to the proportional Noto Sans faces rather than
           show tofu in a terminal/editor. -->
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Bengali</family>
      <family>Noto Sans Gurmukhi</family>
      <family>Noto Sans Gujarati</family>
      <family>Noto Sans Tamil</family>
      <family>Noto Sans Telugu</family>
      <family>Noto Sans Kannada</family>
      <family>Noto Sans Malayalam</family>
      <family>Noto Sans Sinhala</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans Lao</family>
      <family>Noto Sans Khmer</family>
      <family>Noto Sans Myanmar</family>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans Georgian</family>
      <family>Noto Sans Ethiopic</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>

  <!-- ============ Urdu / Arabic: force Noto Sans Arabic ============
       DejaVu Sans claims partial Arabic coverage but is missing the
       Urdu-only letters (U+06C1 heh goal, U+06D2 yeh barree). Generic
       "prefer" ordering alone isn't reliable here because fontconfig's
       default substitution can still resolve a plain sans:lang=ar/ur
       request to DejaVu on some setups (dankc's own renderer hits this
       exact issue — see the FALLBACK_SPECS comment in src/render/nvg.c).
       A strong, lang-keyed prepend guarantees Noto Sans Arabic wins for
       these languages regardless of what family a caller actually asked
       for. -->
  <match target="pattern">
    <test name="lang">
      <string>ur</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- ============ CJK: pin each language to its Noto CJK sub-face ============
       Both Noto Sans CJK and Noto Serif CJK ship as one OTC file each,
       exposing a different "family" name per region index (SC/TC/JP/KR);
       without an explicit per-lang rule, fontconfig has to guess which
       sub-face to use. Serif-requesting patterns get the Serif sub-face;
       everything else (sans-serif, monospace, no family at all) gets Sans. -->
  <match target="pattern">
    <test name="lang">
      <string>zh-cn</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-cn</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-tw</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-tw</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

  <!-- ============ Emoji: append Noto Color Emoji to every generic family
       ============
       So mixed text ("Hello 👋") renders color glyphs instead of tofu in
       browsers/GTK/Qt apps, even for callers that never explicitly ask for
       the "emoji" generic family. dankc's OWN renderer is intentionally
       monochrome-only (its nanovg/stb_truetype text path can't rasterise
       Noto Color Emoji's CBDT color bitmaps — see src/render/nvg.c) and
       instead vendors a monochrome NotoEmoji subset for its bar/panels;
       this system-wide rule is only for the rest of the desktop. -->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- Also cover callers that explicitly request the standalone "emoji"
       generic family. -->
  <match target="pattern">
    <test name="family">
      <string>emoji</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
