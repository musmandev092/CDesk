<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>
    dankc system-wide font fallback. Mirrors dankc's own fontconfig-located
    fallback chain (Inter UI font + Noto Sans/Arabic/CJK/Devanagari/Thai +
    DejaVu safety net + Noto Color Emoji, see src/render/nvg.c) so browsers
    and GTK/Qt apps get the same non-tofu language coverage dankc's own
    nanovg renderer has. Installed to /etc/fonts/conf.d/ by the dankc
    package; remove it (or mask with a higher-numbered conf.d file) if you
    run your own fontconfig setup — see packaging/README.md.
  </description>

  <!-- ================= Generic family fallback chains ================= -->

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>InterVariable</family>
      <family>Noto Sans</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Thai</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif Arabic</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif CJK TC</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Serif CJK KR</family>
      <family>Noto Serif Devanagari</family>
      <family>Noto Serif Thai</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- ============ Urdu / Arabic: force Noto Sans Arabic ============
       DejaVu Sans claims partial Arabic coverage but is missing the
       Urdu-only letters (U+06C1 heh goal, U+06D2 yeh barree). Generic
       "prefer" ordering alone isn't reliable here because fontconfig's
       default substitution can still resolve a plain sans:lang=ar/ur
       request to DejaVu on some setups (dankc's own renderer hits this
       exact issue — see the FALLBACK_SPECS comment in src/render/nvg.c).
       A strong, lang-keyed prepend guarantees Noto Sans Arabic wins for
       these languages regardless of what family a caller actually asked
       for. -->
  <match target="pattern">
    <test name="lang">
      <string>ur</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- ============ CJK: pin each language to its Noto Sans CJK sub-face ====
       Noto Sans CJK ships as one OTC file exposing a different "family"
       name per region index (SC/TC/JP/KR); without an explicit per-lang
       rule, fontconfig has to guess which sub-face to use. -->
  <match target="pattern">
    <test name="lang">
      <string>zh-cn</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>zh-tw</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>ko</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- ============ Emoji: append Noto Color Emoji to every generic family
       ============
       So mixed text ("Hello 👋") renders color glyphs instead of tofu in
       browsers/GTK/Qt apps, even for callers that never explicitly ask for
       the "emoji" generic family. dankc's OWN renderer is intentionally
       monochrome-only (its nanovg/stb_truetype text path can't rasterise
       Noto Color Emoji's CBDT color bitmaps — see src/render/nvg.c) and
       instead vendors a monochrome NotoEmoji subset for its bar/panels;
       this system-wide rule is only for the rest of the desktop. -->
  <match target="pattern">
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- Also cover callers that explicitly request the standalone "emoji"
       generic family. -->
  <match target="pattern">
    <test name="family">
      <string>emoji</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
