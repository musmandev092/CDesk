# tmpfiles.d(5) fragment: create/own the cache directory dankc-greeter uses
# as the greeter user's fake HOME/XDG_*_HOME + DANKC_GREETER_STATE_DIR
# (see scripts/dankc-greeter and docs/GREETER.md). Must match the
# --cache-dir default (/var/cache/dankc-greeter) and the `user =` in
# packaging/greetd/config.toml.example (greeter:greeter).
#
# Install to /usr/lib/tmpfiles.d/dankc-greeter.conf (packages) or
# /etc/tmpfiles.d/dankc-greeter.conf (local), then apply with:
#   systemd-tmpfiles --create /usr/lib/tmpfiles.d/dankc-greeter.conf
# (applied automatically at boot on systemd systems that ship it under
# /usr/lib/tmpfiles.d/).
#
# Type Path                      Mode UID     GID     Age Argument
d      /var/cache/dankc-greeter  0750 greeter greeter -
