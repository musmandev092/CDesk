# sysusers.d(5) fragment: create the unprivileged `greeter` system user
# dankc-greeter (and greetd's [default_session] user=) runs as.
#
# Install to /usr/lib/sysusers.d/dankc-greeter.conf (packages) or
# /etc/sysusers.d/dankc-greeter.conf (local), then apply with:
#   systemd-sysusers /usr/lib/sysusers.d/dankc-greeter.conf
# (or just `systemd-sysusers` with no args to pick up all drop-ins, or
# reboot — sysusers.d fragments are applied automatically at boot on
# systemd systems that ship them under /usr/lib/sysusers.d/).
#
# Many distros' greetd package already creates a `greeter` user; check for
# one (`getent passwd greeter`) before applying this to avoid a duplicate/
# conflicting entry. See docs/GREETER.md.
#
# Type Name  ID  GECOS              Home dir
u greeter -  "System Greeter"  /var/lib/greeter -
